# The pull-request quality gate: format, Release build (warnings as errors), unit/API/architecture
# tests, database tests on Testcontainers, and read-only security scans. Releases and deploys are in
# release.yml and deploy.yml. See docs/architecture/decisions/0004-build-quality-gates.md.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: this workflow only needs to read the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  build-test:
    name: Restore, format, build, test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # The messaging tests need a real broker (ADR-0021). PostgreSQL comes from Testcontainers, which the tests start
    # themselves; RabbitMQ has to be here, on the same pinned image and defaults the Compose stack uses, so the
    # database suite runs the same way locally and on CI.
    services:
      rabbitmq:
        image: rabbitmq:4.3.6-management-alpine@sha256:3505b6096cdbc083bcc363e74366f575ecd0c1a55be4dadcbc60fa08e34647e1
        env:
          RABBITMQ_DEFAULT_USER: tenantflow
          RABBITMQ_DEFAULT_PASS: tenantflow-rabbitmq-local-only
        ports:
          - 5672:5672
          - 15672:15672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q check_port_connectivity"
          --health-interval 5s
          --health-timeout 10s
          --health-retries 24
          --health-start-period 15s
    steps:
      # Third-party actions are pinned to full commit SHAs; the tag is kept as a comment.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Its rules (pinned images, loopback-only ports, synthetic realms) are architecture tests, run by the Test step.
      - name: Validate Compose file (resolves with its defaults alone)
        run: docker compose config --quiet

      - name: Set up .NET SDK from global.json
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "Directory.Packages.props"

      - name: Restore
        run: dotnet restore TenantFlow.sln

      # The build also fails on formatting (IDE0055); this step fails faster and names every file at once.
      - name: Verify formatting and code style
        run: dotnet format TenantFlow.sln --verify-no-changes --no-restore --verbosity minimal

      - name: Build (warnings are errors)
        run: dotnet build TenantFlow.sln --no-restore --configuration Release

      - name: Test
        run: >
          dotnet test TenantFlow.sln
          --no-build
          --configuration Release
          --logger trx
          --results-directory TestResults
          --collect "Code Coverage;Format=cobertura"

      # Database tests against a Testcontainers PostgreSQL (ADR-0019, Open Decision 21): the runner's Docker is
      # reachable directly, so no Compose stack is needed. Locally, they use the running Compose stack instead.
      - name: Database tests (Testcontainers PostgreSQL, service RabbitMQ)
        env:
          TENANTFLOW_TEST_CONTAINER: "1"
          # Named explicitly rather than read from the Compose defaults, so this step does not depend on compose.yaml.
          TENANTFLOW_TEST_RABBITMQ_PORT: "5672"
          TENANTFLOW_TEST_RABBITMQ_MANAGEMENT_PORT: "15672"
          TENANTFLOW_TEST_RABBITMQ_USER: tenantflow
          TENANTFLOW_TEST_RABBITMQ_PASSWORD: tenantflow-rabbitmq-local-only
        run: dotnet run --project tests/Database/TenantFlow.Database.Tests --no-build --configuration Release

      - name: Upload test results and coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: TestResults
          retention-days: 14
          if-no-files-found: warn

  # SPEC-0009 criterion 14 (ADR-0028): the same scans as tests/Security locally, read-only, no secrets. The full
  # history is fetched so the secret scan sees every commit. Defined while CI is on hold; its first run comes with a remote.
  security:
    name: Security scans
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up .NET SDK from global.json
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Secrets, dependencies, images, configuration and infrastructure code
        run: dotnet run --project tests/Security/TenantFlow.Security.Tests -c Release
