# Reviewed exceptions to the security scans (SPEC-0009 criterion 13, ADR-0028 decision 3).
# Each entry: tool (secrets | dependencies | images | config | iac), id, target, reason, owner, expires (yyyy-MM-dd).
# Ids: secrets "rule:path" or a gitleaks fingerprint; dependencies a GHSA id; images a CVE id; config the finding the
# scan prints; iac a Trivy check id. An expired or incomplete entry fails the build (SecurityScanTests); the scans in
# tests/Security skip what it names.
# Never add an entry to make a scan pass without a reason a reviewer can check.
exceptions:
  - tool: secrets
    id: generic-api-key:deploy/compose/.env.example
    target: AUDIT_OPERATOR_REFERENCE_KEY
    reason: Local-only placeholder key (ADR-0008 pattern); it is base64 of the text "tenantflow-audit-key-local-only!" and is never used outside a developer machine. Refusing it outside Development is S2-L6. Since ADR-0037 the file no longer holds it; git history still does.
    owner: user
    expires: 2027-04-22
  - tool: secrets
    id: generic-api-key:src/Hosts/TenantFlow.Api/appsettings.Development.json
    target: Audit:OperatorReferenceKey
    reason: The same local-only placeholder key as the entry above, moved into the API's Development settings by ADR-0037 (Proposed). The Dockerfile deletes every appsettings.Development.json from the images, and outside Development the key comes from the secret manager.
    owner: user
    expires: 2027-04-22
  - tool: secrets
    id: stripe-access-token:tests/Payments/TenantFlow.Payments.Tests/Stripe/StripePaymentProviderTests.cs
    target: TestKey
    reason: Synthetic value "sk_test_placeholder..." that tests the Stripe test-mode key rule; not a key.
    owner: user
    expires: 2027-04-22
  - tool: secrets
    id: stripe-access-token:tests/Database/TenantFlow.Database.Tests/Payments/PaymentReconciliationTests.cs
    target: Payments:Stripe:SecretKey test setting
    reason: Synthetic value "sk_test_placeholder..." that selects the Stripe adapter in a test with a fake client; not a key.
    owner: user
    expires: 2027-04-22
  - tool: secrets
    id: stripe-access-token:docs/specs/0009-security-and-privacy.md
    target: SPEC-0009 Verification row 13 in commit 7c1d12c
    reason: The spec once quoted the synthetic test placeholder above; the text is reworded now, but history keeps it. Not a key.
    owner: user
    expires: 2027-04-22

