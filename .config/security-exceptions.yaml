  # Write scopes that exist because of a security control, not in spite of one (approved by the user, 2026-10-24).
  # Every workflow defaults to "permissions: {}" and each job asks for the minimum it needs; neither scope below
  # grants write access to repository contents. The ids carry a line number, so re-check them whenever a
  # permissions block moves.
  - tool: config
    id: workflow:deploy.yml:write_permission:line28
    target: deploy.yml deploy job, id-token - write
    reason: OIDC federation to AWS with no long-lived access key (ADR-0032, ADR-0033). The job exchanges a short-lived GitHub token for an AWS role; id-token - write grants only the ability to mint that token. Removing it would mean storing static AWS credentials as repository secrets, which is the risk SC-A08 exists to avoid.
    owner: user
    expires: 2027-04-22
  - tool: config
    id: workflow:release.yml:write_permission:line32
    target: release.yml build job, id-token - write
    reason: The same OIDC federation as the deploy.yml entry above, used here to push images to ECR without a static credential (ADR-0032).
    owner: user
    expires: 2027-04-22
  - tool: config
    id: workflow:release.yml:write_permission:line33
    target: release.yml build job, attestations - write
    reason: Build provenance and SBOM attestations (SPEC-0012 S3d, threat row SC-A14). This scope is what lets the build attach signed provenance to the image it just pushed; it grants no write access to repository contents. Removing it would remove the supply-chain evidence the threat model asks for.
    owner: user
    expires: 2027-04-22
  - tool: config
    id: workflow:release.yml:write_permission:line178
    target: release.yml staging job, id-token - write
    reason: The staging job calls deploy.yml, which needs the OIDC token to assume the deployment role; a called workflow cannot be granted more than its caller holds.
    owner: user
    expires: 2027-04-22
  - tool: config
    id: workflow:release.yml:write_permission:line194
    target: release.yml prod job, id-token - write
    reason: The same OIDC token as the staging job, for the prod deployment role, behind the prod environment's reviewer approval.
    owner: user
    expires: 2027-04-22
