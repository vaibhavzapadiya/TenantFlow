# Tempo (local observability profile): single process, local disk storage, OTLP over gRPC.
# Traces are kept 7 days (ADR-0025, SPEC-0010 criterion 8): the scheduler plans retention, the worker applies it.
stream_over_http_enabled: true

server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

backend_scheduler:
  provider:
    compaction:
      compaction:
        block_retention: 168h

backend_worker:
  compaction:
    block_retention: 168h
