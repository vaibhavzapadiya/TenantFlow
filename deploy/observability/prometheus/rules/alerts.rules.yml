      - alert: SloPaymentResolutionSlowBurn
        expr: >-
          tenantflow:slo_error_ratio:rate6h{slo="payment_resolution"} > on (slo) (6 * (1 - tenantflow:slo_objective{slo="payment_resolution"}))
          and on (slo) tenantflow:slo_error_ratio:rate30m{slo="payment_resolution"} > on (slo) (6 * (1 - tenantflow:slo_objective{slo="payment_resolution"}))
        for: 15m
        labels:
