          runbook: docs/operations/runbooks/stuck-payment-and-reconciliation.md
          description: "See docs/operations/slos/payment-resolution.md. The target is provisional (ADR-0030)."
      - alert: SloExportCompletionFastBurn
        expr: >-
          tenantflow:slo_error_ratio:rate1h{slo="export_completion"} > on (slo) (14.4 * (1 - tenantflow:slo_objective{slo="export_completion"}))
          and on (slo) tenantflow:slo_error_ratio:rate5m{slo="export_completion"} > on (slo) (14.4 * (1 - tenantflow:slo_objective{slo="export_completion"}))
        for: 2m
