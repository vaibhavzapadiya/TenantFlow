          and on (slo) tenantflow:slo_error_ratio:rate30m{slo="order_submission"} > on (slo) (6 * (1 - tenantflow:slo_objective{slo="order_submission"}))
        for: 15m
        labels:
          severity: ticket
          category: symptom
        annotations:
          summary: "The order submission SLO burns its error budget 6x too fast (6h and 30m windows)"
          runbook: docs/operations/runbooks/api-errors.md
          description: "See docs/operations/slos/order-submission.md. The target is provisional (ADR-0030)."
      - alert: SloPaymentResolutionFastBurn
        expr: >-
          tenantflow:slo_error_ratio:rate1h{slo="payment_resolution"} > on (slo) (14.4 * (1 - tenantflow:slo_objective{slo="payment_resolution"}))
          and on (slo) tenantflow:slo_error_ratio:rate5m{slo="payment_resolution"} > on (slo) (14.4 * (1 - tenantflow:slo_objective{slo="payment_resolution"}))
        for: 2m
        labels:
          severity: page
          category: symptom
        annotations:
          summary: "The payment resolution SLO burns its error budget 14.4x too fast (1h and 5m windows)"
          runbook: docs/operations/runbooks/stuck-payment-and-reconciliation.md
